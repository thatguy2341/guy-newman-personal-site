# Render Blueprint: put this file at the root of the GitHub repo.
services:
  - type: web
    runtime: static
    name: guy-newman
    rootDir: html- Personal Site
    buildCommand: echo "No build step - plain static site"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /img/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /js/*
        name: Cache-Control
        value: public, max-age=86400
